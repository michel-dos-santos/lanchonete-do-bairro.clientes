apiVersion: v1
kind: Service
metadata:
  name: clientes-svc-load-balancer
  labels:
    app: clientes-svc-load-balancer
spec:
  type: LoadBalancer
  selector:
    app: clientes-deployment
  ports:
    - name: api
      port: 80
      protocol: TCP
      targetPort: 8010
      nodePort: 31010
    - name: db
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 32432